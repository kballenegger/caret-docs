openapi: 3.1.0
info:
  title: Caret BYOB API
  version: 1.2.0
  summary: The bring-your-own-backend contract for the Caret iOS keyboard.
  description: |
    Caret v1 operates with no first-party backend. The user configures a backend
    base URL and API key in the Caret containing app; the keyboard talks to that
    backend using this contract. This document is the single source of truth
    between the Caret iOS client and any conforming backend implementation.

    ## Conventions

    - All endpoints are served under the user-configured base URL. `https://` is
      required in production configurations; the Caret client permits `http://`
      only for `localhost`/`127.0.0.1`, RFC-1918 hosts, `*.ts.net` hostnames, and
      Tailscale CGNAT addresses (`100.64.0.0/10`) to support development and
      TestFlight testing, and marks such endpoints as insecure in Settings.
    - Every request except `GET /v1/health` requires
      `Authorization: Bearer <api-key>`.
    - Every request carries `X-Caret-Client` identifying the client build.
    - Every non-2xx response uses the standard error envelope (`Error` schema)
      with a stable machine-readable `code` and a `retryable` hint.
    - Every response (success and error) carries a server-generated `request_id`
      for correlation.
    - Unknown JSON fields are always ignored by clients and servers. Additive
      fields are non-breaking. Breaking changes require a new path version
      (`/v2`). Error `code` values are append-only.

    ## Dictate is mandatory; Ask and Imagine are not (1.2)

    A conforming backend **takes speech**. `capabilities.dictation` must be
    `true`, `POST /v1/dictation/sessions` and its chunk and transcript
    endpoints must work, and a backend that cannot transcribe is not a
    partially-featured Caret backend — it is a non-conforming one, and it says
    so rather than reporting `ok`.

    Ask (`/v1/draft`) and Imagine (`/v1/imagine`) are optional extensions on
    top of that. A backend with no agent configured reports
    `capabilities.draft: false` and answers `404 not_found` on `/v1/draft`; a
    backend with no image provider reports `capabilities.imagine: false` and
    answers `404 not_found` on `/v1/imagine`. Both are valid, conforming
    deployments. "Ask on, Dictate off" is not.

    `GET /v1/health` carries this in two places:

    - `status` — `ok` (ready), `degraded` (serving, but an upstream dependency
      is impaired), or `not_ready` (**does not meet the contract**: the client
      shows a setup-incomplete state rather than a transient warning).
    - `readiness` — `{ready: bool, blockers: [{code, message}]}`. Blocker codes
      are stable and append-only: `no_stt_adapter` (mandatory dictation has no
      transcriber) and `no_api_keys` (nothing configured to authenticate
      against, so every authenticated call would fail closed).

    A `not_ready` backend still answers health, so setup tooling can poll it and
    show exactly what is missing.

    ## One input model for every mode (1.1)

    Every generative surface — Dictate, Ask, Imagine — takes its user input
    through the **same** client-facing interface. There is exactly one audio
    protocol in this contract (the chunked session below); Ask and Imagine do
    not define one of their own, they *consume* a session.

    ```jsonc
    // typed
    "input": { "type": "text", "text": "…" }
    // spoken — the session opened and uploaded exactly as for Dictate
    "input": { "type": "audio", "session_id": "sess_…",
               "client_chunk_count": 21, "client_total_duration_ms": 61800 }
    ```

    A backend declares which modes it accepts in
    `GET /v1/health` → `capabilities.input_modes`. A surface that receives an
    input type it does not accept answers `422 unsupported_input_type`.

    ### Audio session flow (shared)

    Audio is captured by the Caret containing app (never by the keyboard
    extension), encoded as 16 kHz mono little-endian PCM16, split into
    sequence-numbered chunks (~3 s), and uploaded with per-chunk SHA-256
    verification:

    1. `POST /v1/dictation/sessions` — open a session. `intent`
       (`dictate` | `ask` | `imagine`, default `dictate`) is an advisory hint.
    2. `PUT /v1/dictation/sessions/{session_id}/chunks/{seq}` — upload each
       chunk; idempotent per `(session_id, seq)`; safe to retry.
    3. **Consume the session** with exactly one of:
       - `POST /v1/dictation/sessions/{session_id}/transcript` (Dictate),
       - `POST /v1/draft` with an audio `input` (Ask),
       - `POST /v1/imagine` with an audio `input` (Imagine).

    All three consumers share identical semantics: the server verifies chunk
    completeness first and answers `200` with `status: "missing_chunks"` and the
    gaps to re-upload; work that outlives a request cycle answers `202` with
    `Retry-After` and the client **re-posts the identical body** to poll; the
    terminal result (success *or* failure) is cached on the session, so polling
    never re-runs work and duplicate calls replay the same response. A session
    carries exactly one terminal result: consuming an already-consumed session
    from a *different* surface returns `409 session_conflict`, and retrying
    after a terminal failure requires a new session.

    ## Connecting a device: the `caret-connect:v1` QR (1.2)

    Configuring Caret means moving a base URL and an API key onto a phone.
    Typing a 43-character key on a phone keyboard is the worst step in the whole
    setup, so the client is scan-first with manual entry as the fallback: it
    reads a QR encoding a single string.

    ```
    caret-connect:v1:<base64url(minified JSON)>
    ```

    - base64url per RFC 4648 §5 (`+`→`-`, `/`→`_`), **unpadded**.
    - The JSON is minified UTF-8 with sorted keys:
      `{"k":"<api key>","t":"agent"|"hosted","u":"<base url>"}`.
    - `t` is case-sensitive. `agent` means a self-hosted backend implementing
      this contract and **requires** `u`. `hosted` means a Caret-operated
      backend and **must omit** `u` — the client pins its own canonical URL and
      rejects a `hosted` payload that names a different one, so such a code can
      never be rewritten to redirect a device at another server.
    - `k` is 10–300 characters.
    - Unknown fields are ignored, so the payload can gain fields without a `v2`.

    Worked example, byte-pinned (the key is a test vector, not a real key):

    ```
    {"k":"caret_demo_key_1234567890","t":"agent","u":"https://agent.example.com"}
    → caret-connect:v1:eyJrIjoiY2FyZXRfZGVtb19rZXlfMTIzNDU2Nzg5MCIsInQiOiJhZ2VudCIsInUiOiJodHRwczovL2FnZW50LmV4YW1wbGUuY29tIn0
    ```

    **The QR is a credential, not a pointer to one.** It carries the API key
    verbatim. Anyone who scans it, photographs the screen, or finds the saved
    image can connect as its owner, and keeps that access until the key is
    rotated — rotating the key is the only revocation. Backends and dashboards
    that render one must: generate it only when explicitly asked, serve it only
    to an authenticated owner, never log the payload, and mask it in ordinary
    console or UI output.

    This QR is produced by whatever configures the backend; it is not an
    endpoint in this contract. The reference backend emits it with
    `python3 -m caret_backend --qr --url <base-url>`.

    ### Pairing tokens (optional server extension)

    A backend that would rather not put a durable key on screen may implement
    `/v1/pairing/*` below: a short-lived, single-use, URL-bound token that a
    client exchanges once for the key. It is **not** part of the client
    contract — the Caret iOS app does not implement it — and exists for
    operators and for third-party clients. Backends may omit it entirely.

    ## Backwards compatibility

    `1.0` clients sent `instruction` (Ask) and `prompt` (Imagine) as top-level
    strings. Those remain accepted forever as aliases for
    `input: {type: "text", text: …}`. Sending both the alias and `input` is
    `422 input_invalid`. Responses only gained fields (`status`, `input_type`,
    `transcript`); `DraftResponse.text` is still present and populated on every
    successful text-input draft, so a 1.0 client needs no change.
servers:
  - url: "{base_url}"
    variables:
      base_url:
        default: https://backend.example.com
        description: The backend base URL the user configured in the Caret app.
tags:
  - name: health
    description: Connection probe.
  - name: draft
    description: Ask — typed or spoken instruction to insert-ready text.
  - name: imagine
    description: Imagine — typed or spoken prompt to a generated image.
  - name: dictation
    description: Chunked audio sessions (the one audio protocol; shared by all modes).
  - name: pairing
    description: |
      Optional server extension for handing a device access without handing it
      a durable key. Not implemented by the Caret iOS client, which connects by
      scanning a `caret-connect:v1` code.

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Connection probe
      description: |
        Liveness and configuration probe. Must respond without authentication so
        the Caret app can distinguish "unreachable" from "bad key" in a single
        round trip: when an `Authorization` header is present, the server
        validates the key and reports the result in `auth` without failing the
        request.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      responses:
        "200":
          description: Backend is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                authenticated:
                  summary: Probe with a valid key
                  value:
                    status: ok
                    service: acme-caret-backend
                    contract: caret/v1
                    version: 1.4.2
                    time: "2026-08-03T09:12:44Z"
                    auth: { presented: true, valid: true }
                    capabilities:
                      draft: true
                      imagine: true
                      dictation: true
                      input_modes:
                        draft: [text, audio]
                        imagine: [text, audio]
                        dictation: [audio]
                    request_id: req_9f31c2
                anonymous:
                  summary: Probe without a key
                  value:
                    status: ok
                    service: acme-caret-backend
                    contract: caret/v1
                    version: 1.4.2
                    time: "2026-08-03T09:12:44Z"
                    auth: { presented: false, valid: null }
                    readiness: { ready: true, blockers: [] }
                    capabilities:
                      draft: true
                      imagine: true
                      dictation: true
                      input_modes:
                        draft: [text, audio]
                        imagine: [text, audio]
                        dictation: [audio]
                    request_id: req_2b8d10
                dictationOnly:
                  summary: A valid backend with no agent configured
                  description: |
                    Dictation works, so this backend conforms. Ask and Imagine
                    are honestly off and answer `404 not_found`.
                  value:
                    status: ok
                    service: acme-caret-backend
                    contract: caret/v1
                    version: 1.4.2
                    time: "2026-08-03T09:12:44Z"
                    auth: { presented: true, valid: true }
                    readiness: { ready: true, blockers: [] }
                    capabilities:
                      draft: false
                      imagine: false
                      dictation: true
                      input_modes:
                        dictation: [audio]
                    request_id: req_5c19ab
                notReady:
                  summary: Not a conforming backend — dictation is unavailable
                  description: |
                    Mandatory dictation has no transcriber. The client shows a
                    setup-incomplete state; it does not treat this as a
                    transient upstream problem.
                  value:
                    status: not_ready
                    service: acme-caret-backend
                    contract: caret/v1
                    version: 1.4.2
                    time: "2026-08-03T09:12:44Z"
                    auth: { presented: true, valid: true }
                    readiness:
                      ready: false
                      blockers:
                        - code: no_stt_adapter
                          message: "dictation is mandatory and no STT adapter is configured"
                    capabilities:
                      draft: true
                      imagine: false
                      dictation: false
                      input_modes:
                        draft: [text]
                    request_id: req_71ca3f
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/draft:
    post:
      operationId: createDraft
      tags: [draft]
      summary: Ask — draft insert-ready text from a typed or spoken instruction
      description: |
        Turns a user instruction into a single insert-ready message. The
        instruction arrives either typed (`input.type: "text"`) or spoken
        (`input.type: "audio"`, naming an audio session uploaded exactly as for
        Dictate). The Caret client always previews the result before insertion.

        Idempotent by `client_request_id`: a replay with the same id returns the
        original result and performs no new work. Client timeout is 30 seconds
        for text input; audio input follows the async polling rules below.

        **Text input** is synchronous: `200` with `status: "complete"`.

        **Audio input** behaves exactly like dictation finalize:
        `200 status: "missing_chunks"` when uploads are incomplete, `202` +
        `Retry-After` while the transcription/draft is in flight (re-post the
        identical body to poll), and a terminal result cached on the session.
        The response also carries the `transcript` that was drafted from, so the
        client can show what it heard.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
            examples:
              typed:
                summary: Typed instruction
                value:
                  input:
                    type: text
                    text: "Reply that Thursday afternoon works, keep it short and warm."
                  visible_text: "Could you do Thursday or Friday?"
                  app_hint: "WhatsApp"
                  client_request_id: "6d3f6a3e-4a1c-4b6e-9a7e-0c2d1e8f5b21"
              spoken:
                summary: Spoken instruction (audio session)
                value:
                  input:
                    type: audio
                    session_id: sess_b4f1e9
                    client_chunk_count: 4
                    client_total_duration_ms: 11200
                  visible_text: "Could you do Thursday or Friday?"
                  app_hint: "WhatsApp"
                  client_request_id: "9f0f2b1a-58cc-4c0e-8f1e-77c2b0a91d34"
              legacy:
                summary: 1.0 alias (still supported)
                value:
                  instruction: "Reply that Thursday afternoon works."
                  client_request_id: "1c9a5f7e-2f30-4c9a-9d1e-7a4bb2f0c611"
      responses:
        "200":
          description: Draft produced — or `missing_chunks` listing gaps to re-upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResponse"
              examples:
                typed:
                  value:
                    status: complete
                    input_type: text
                    text: "Thursday afternoon works great for me — see you then!"
                    request_id: req_71acd0
                spoken:
                  value:
                    status: complete
                    input_type: audio
                    text: "Thursday afternoon works great for me — see you then!"
                    transcript: "reply that thursday afternoon works keep it short and warm"
                    session_id: sess_b4f1e9
                    missing_chunks: []
                    duration_ms: 11200
                    request_id: req_71acd1
                missing:
                  value:
                    status: missing_chunks
                    input_type: audio
                    text: null
                    session_id: sess_b4f1e9
                    missing_chunks: [2]
                    request_id: req_a17e41
        "202":
          description: Spoken draft in progress. Re-post the identical body after `Retry-After` seconds.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncInProgress"
              example:
                status: in_progress
                session_id: sess_b4f1e9
                started_at: "2026-08-06T09:14:02Z"
                elapsed_seconds: 2.1
                retry_after_seconds: 3
                request_id: req_f00d22
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSession"
        "409":
          $ref: "#/components/responses/SessionConflict"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          description: |
            Input rejected. `instruction_invalid` (empty or over 4000 chars),
            `input_invalid` (missing input, or both `input` and the legacy
            alias), `unsupported_input_type` (this backend does not accept
            audio for Ask), or an audio guard (`audio_too_short`,
            `no_speech_detected`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                instruction:
                  value:
                    error:
                      code: instruction_invalid
                      message: "instruction must be 1-4000 characters"
                      retryable: false
                    request_id: req_5540bc
                input:
                  value:
                    error:
                      code: input_invalid
                      message: "provide exactly one of input or instruction"
                      retryable: false
                    request_id: req_5540bd
                unsupported:
                  value:
                    error:
                      code: unsupported_input_type
                      message: "this backend accepts text input only for /v1/draft"
                      retryable: false
                    request_id: req_5540be
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Transcription of the spoken instruction failed (cached). Open a new session to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: transcription_failed
                  message: "speech-to-text backend unavailable"
                  retryable: true
                request_id: req_d55e03
        "504":
          description: Upstream model timed out. Client offers retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: draft_timeout
                  message: "the model did not answer in time"
                  retryable: true
                request_id: req_c2d901

  /v1/imagine:
    post:
      operationId: createImage
      tags: [imagine]
      summary: Imagine — generate an image from a typed or spoken prompt
      description: |
        Optional capability (`capabilities.imagine`). Turns a prompt into one
        generated image the client previews and inserts. The prompt arrives
        typed (`input.type: "text"`) or spoken (`input.type: "audio"`, an audio
        session uploaded exactly as for Dictate) — there is no separate audio
        path for Imagine.

        Always asynchronous: the first call returns `202` with `Retry-After`,
        and the client polls by **re-posting the identical body**. The terminal
        result — success *and* failure — is cached per `client_request_id`, so a
        poll never generates a second image and a retry after a terminal failure
        requires a **new** `client_request_id`. Backends that do not implement
        Imagine answer `404` and report `capabilities.imagine: false`.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagineRequest"
            examples:
              typed:
                value:
                  input:
                    type: text
                    text: "a lighthouse in a storm, ink wash, muted terracotta"
                  aspect_ratio: "1:1"
                  quality: "high"
                  client_request_id: "3b9d1c77-59c8-4f0f-9a1d-2f4e6b8c0a55"
              spoken:
                value:
                  input:
                    type: audio
                    session_id: sess_c71f02
                    client_chunk_count: 3
                    client_total_duration_ms: 8400
                  client_request_id: "5d2f8a10-6e3b-4a71-b0c9-15ee2a9f7d43"
      responses:
        "200":
          description: Image ready — or `missing_chunks` listing gaps to re-upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagineResponse"
              examples:
                complete:
                  value:
                    status: complete
                    input_type: text
                    media:
                      kind: image
                      mime_type: image/png
                      filename: imagine.png
                      byte_length: 812345
                      sha256: "3f2a…"
                      inline_base64: "iVBORw0KGgo…"
                    provider: acme-images
                    model: acme-image-1
                    aspect_ratio: "1:1"
                    size: "1024x1024"
                    quality: high
                    request_id: req_2f91cc
                missing:
                  value:
                    status: missing_chunks
                    input_type: audio
                    session_id: sess_c71f02
                    missing_chunks: [1]
                    request_id: req_2f91cd
        "202":
          description: Generation in progress. Re-post the identical body after `Retry-After` seconds.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncInProgress"
              example:
                status: in_progress
                started_at: "2026-08-06T09:14:02Z"
                elapsed_seconds: 6.4
                retry_after_seconds: 3
                request_id: req_9ab120
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            This backend does not implement Imagine — it reports
            `capabilities.imagine` as false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: not_found, message: "imagine is not implemented", retryable: false }
                request_id: req_31c0aa
        "409":
          $ref: "#/components/responses/SessionConflict"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          description: |
            `prompt_invalid` (empty or over 4000 chars), `input_invalid`,
            `unsupported_input_type`, `unsupported_aspect_ratio`,
            `unsupported_quality`, or an audio guard (`audio_too_short`,
            `no_speech_detected`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: prompt_invalid
                  message: "prompt must be 1-4000 characters"
                  retryable: false
                request_id: req_77b0c1
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: |
            Generation failed (cached). `image_generation_failed`, or
            `transcription_failed` for a spoken prompt. Retry with a NEW
            `client_request_id` (and a new session for spoken prompts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: image_generation_failed
                  message: "image provider unavailable"
                  retryable: true
                request_id: req_5c9a30

  /v1/dictation/sessions:
    post:
      operationId: createDictationSession
      tags: [dictation]
      summary: Open an audio session
      description: |
        Opens a chunked-upload audio session — the single audio protocol for
        every Caret mode. The session is later consumed by exactly one of
        `POST /v1/dictation/sessions/{id}/transcript` (Dictate), `POST /v1/draft`
        (Ask) or `POST /v1/imagine` (Imagine); `intent` says which one the client
        expects to use, as an advisory hint only.

        Idempotent by `client_request_id`: a replay returns the same
        `session_id`. Sessions expire server-side after one hour without being
        consumed; expired sessions return `410` from subsequent calls.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictationSessionRequest"
            example:
              client_request_id: "0b7e9d2c-7a44-4d2b-9a11-3f6c8e0a5d77"
              codec: pcm16
              sample_rate_hz: 16000
              channels: 1
              intent: ask
              app_hint: "Mail"
              language_hint: "en"
      responses:
        "200":
          description: Session opened (or idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictationSessionResponse"
              example:
                session_id: sess_b4f1e9
                chunk_max_bytes: 524288
                chunk_target_duration_ms: 3000
                expires_at: "2026-08-03T10:12:44Z"
                request_id: req_e01aa3
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: Codec unsupported. v1 requires pcm16.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: unsupported_audio_codec
                  message: "only pcm16 is supported"
                  retryable: false
                request_id: req_88d0f2
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/dictation/sessions/{session_id}/chunks/{seq}:
    put:
      operationId: uploadDictationChunk
      tags: [dictation]
      summary: Upload one audio chunk
      description: |
        Uploads the chunk with sequence number `seq` (0-based, contiguous).
        Idempotent by `(session_id, seq)`: re-uploading an identical chunk
        returns `200` with `duplicate: true`; a same-seq upload whose SHA-256
        differs from the stored chunk returns `409 chunk_seq_conflict`. A body
        whose SHA-256 does not match the `X-Caret-Chunk-SHA256` header returns
        `409 chunk_checksum_mismatch` and the client re-uploads. The client
        uploads chunks serially with retry/backoff and keeps every chunk on disk
        until finalize succeeds.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: seq
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: X-Caret-Chunk-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the request body.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-Caret-Chunk-Duration-Ms
          in: header
          required: true
          description: Audio duration of this chunk in milliseconds.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw PCM16 little-endian mono 16 kHz audio bytes. Max 524288 bytes (or the session's `chunk_max_bytes`).
      responses:
        "200":
          description: Chunk accepted (or idempotent duplicate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkResponse"
              example:
                session_id: sess_b4f1e9
                seq: 7
                accepted: true
                duplicate: false
                request_id: req_10bd77
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSession"
        "409":
          description: Checksum mismatch or conflicting same-seq content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                checksum:
                  value:
                    error:
                      code: chunk_checksum_mismatch
                      message: "body hash does not match X-Caret-Chunk-SHA256"
                      retryable: true
                    request_id: req_3c91e5
                conflict:
                  value:
                    error:
                      code: chunk_seq_conflict
                      message: "a different chunk was already stored at seq 7"
                      retryable: false
                    request_id: req_77a2d8
        "410":
          $ref: "#/components/responses/SessionExpired"
        "413":
          description: Chunk exceeds `chunk_max_bytes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: chunk_too_large
                  message: "chunk exceeds 524288 bytes"
                  retryable: false
                request_id: req_9e01b4
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/dictation/sessions/{session_id}/transcript:
    post:
      operationId: finalizeDictation
      tags: [dictation]
      summary: Finalize — produce the polished transcript
      description: |
        Closes the session and produces the insert-ready transcript. The server
        first verifies chunk completeness against `client_chunk_count`; if any
        uploads are missing it returns `200` with `missing_chunks` populated and
        `text: null`, and the client re-uploads then re-finalizes.

        Transcription may take longer than a request cycle: the server returns
        `202` with `Retry-After` while work is in flight, and the client
        re-polls this endpoint with the same body. The terminal result (success
        or failure) is cached on the session — polling never re-runs
        transcription, and duplicate finalize calls after success return the
        identical response. A `retryable: true` failure requires a new session.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
            example:
              client_chunk_count: 21
              client_total_duration_ms: 61800
              polish: true
      responses:
        "200":
          description: Transcript ready — or `missing_chunks` listing gaps to re-upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
              examples:
                success:
                  value:
                    session_id: sess_b4f1e9
                    status: complete
                    text: "Here's the plan for Thursday: I'll land at two, drop my bags, and meet you at the gallery by four."
                    missing_chunks: []
                    duration_ms: 61800
                    request_id: req_f00d21
                missing:
                  value:
                    session_id: sess_b4f1e9
                    status: missing_chunks
                    text: null
                    missing_chunks: [7, 8]
                    duration_ms: 0
                    request_id: req_a17e40
        "202":
          description: Transcription in progress. Re-poll with the same body after `Retry-After` seconds.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before re-polling. Default 3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeInProgress"
              example:
                session_id: sess_b4f1e9
                status: in_progress
                started_at: "2026-08-03T09:14:02Z"
                elapsed_seconds: 2.1
                retry_after_seconds: 3
                request_id: req_f00d21
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSession"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          description: Audio rejected by guards (cached; not retryable with the same audio).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: no_speech_detected
                  message: "no speech found in the uploaded audio"
                  retryable: false
                request_id: req_b3391a
        "503":
          description: Transcription failed (cached). Open a new session to retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: transcription_failed
                  message: "speech-to-text backend unavailable"
                  retryable: true
                request_id: req_d55e02
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/pairing/tokens:
    post:
      operationId: mintPairingToken
      tags: [pairing]
      summary: Mint a single-use pairing token (optional extension)
      description: |
        Optional server extension; see "Pairing tokens" above. Not implemented
        by the Caret iOS client — a backend may omit these endpoints entirely,
        and one that does answers `404`.

        Creates a short-lived, single-use token bound to `server_url`, which a
        client exchanges once at `POST /v1/pairing/claim` for the API key. The
        key handed over is the one the caller authenticated with, so a caller
        can never issue a credential it does not already hold.

        Refuses with `409 backend_not_ready` while `readiness.ready` is false:
        pairing a device to a backend that cannot take dictation produces a
        keyboard with no microphone and nothing to explain it.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingMintRequest"
      responses:
        "200":
          description: Token minted. The plaintext token appears here and nowhere else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingMintResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Pairing is not implemented or is disabled on this backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_disabled, message: "pairing is turned off on this backend", retryable: false }
                request_id: req_31ad7c
        "409":
          description: The backend does not meet the contract yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: backend_not_ready, message: "refusing to pair: this is not a ready Caret backend yet (no_stt_adapter)", retryable: false }
                request_id: req_88b0e1
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listPairingTokens
      tags: [pairing]
      summary: List live pairing tokens (optional extension)
      description: |
        Metadata only. Never returns a token or an API key — the plaintext
        token is returned once, at mint, and only its digest is retained.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      responses:
        "200":
          description: Live and recently-terminal tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens, request_id]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/PairingTokenSummary"
                  request_id: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/pairing/claim:
    post:
      operationId: claimPairingToken
      tags: [pairing]
      summary: Exchange a pairing token for the API key (optional extension)
      description: |
        Anonymous by necessity: the client has no key yet, which is what this
        call is for. The token is the credential, it is consumed on the way
        through, and this response body is the only place the API key appears.

        `server_url` must be the URL the client was given. A token minted for
        one backend cannot be claimed against another — without that check, an
        attacker who relays a pairing code has the key delivered to a server of
        their choosing.

        Every failure has its own code, so a client can say what went wrong
        instead of "pairing failed".
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingClaimRequest"
      responses:
        "200":
          description: Token consumed; the configuration follows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingClaimResponse"
        "400":
          description: Malformed, or claimed against the wrong server URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_url_mismatch, message: "this pairing token was issued for a different server URL", retryable: false }
                request_id: req_4c0e91
        "401":
          description: No such token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_token_invalid, message: "no such pairing token: generate a new one on the server", retryable: false }
                request_id: req_9ab210
        "409":
          description: Already claimed — pairing tokens are single-use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_token_consumed, message: "this pairing token was already used", retryable: false }
                request_id: req_70cc4d
        "410":
          description: Expired or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_token_expired, message: "this pairing token expired: generate a new one on the server", retryable: false }
                request_id: req_1de83b
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /v1/pairing/revoke:
    post:
      operationId: revokePairingToken
      tags: [pairing]
      summary: Revoke a pairing token (optional extension)
      description: |
        Revokes one token by id, or every pending one with `{"all": true}`.
        Neither touches the API key — that is the whole advantage of a pairing
        token over a code that carries the key itself, which can only be
        revoked by rotating the key.
      parameters:
        - $ref: "#/components/parameters/CaretClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRevokeRequest"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked, scope, request_id]
                properties:
                  revoked: { type: integer, description: How many tokens were revoked. }
                  scope: { type: string, enum: [one, all] }
                  token:
                    $ref: "#/components/schemas/PairingTokenSummary"
                  request_id: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such token id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: pairing_token_invalid, message: "no such pairing token: pt_1a2b3c4d", retryable: false }
                request_id: req_6f2d18
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The user-provided API key, exactly as configured in the Caret app.
        Stored client-side in the iOS Keychain only. Servers must treat keys as
        opaque strings and return `401 unauthorized` for missing/invalid keys.

  parameters:
    CaretClient:
      name: X-Caret-Client
      in: header
      required: true
      description: |
        Client identification, always sent:
        `caret-keyboard/<app-version> ios/<ios-version> <device-model>`
        (e.g. `caret-keyboard/1.0.0 ios/26.0 iPhone17,1`). Servers log it for
        diagnostics and may vary behavior only on the major contract version.
      schema:
        type: string
        examples: ["caret-keyboard/1.0.0 ios/26.0 iPhone17,1"]

  responses:
    ErrorResponse:
      description: Standard error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: bad_request, message: "body is not valid JSON", retryable: false }
            request_id: req_0a11fe
    Unauthorized:
      description: Missing or invalid API key. The client shows "check your API key" and links to Settings.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unauthorized, message: "invalid API key", retryable: false }
            request_id: req_44c1d9
    RateLimited:
      description: Rate limited. The client backs off exponentially, honoring `Retry-After` when present.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: rate_limited, message: "too many requests", retryable: true }
            request_id: req_61b0aa
    UnknownSession:
      description: Session id not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unknown_session, message: "no such dictation session", retryable: false }
            request_id: req_902bd1
    SessionConflict:
      description: |
        The session already carries a terminal result produced by a different
        surface (e.g. finalized as Dictate, then posted to `/v1/draft`). A
        session is consumed exactly once; open a new one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: session_conflict, message: "session already consumed by dictation", retryable: false }
            request_id: req_5b12ce
    SessionExpired:
      description: Session TTL exceeded (1 hour without being consumed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: session_expired, message: "dictation session expired", retryable: false }
            request_id: req_23fa08
    ServerError:
      description: Internal server error. The client shows a plain-language failure and offers retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: internal_error, message: "unexpected server error", retryable: true }
            request_id: req_7d3e5c

  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code. v1 codes: `bad_request`,
                `unauthorized`, `rate_limited`, `instruction_invalid`,
                `draft_timeout`, `unsupported_audio_codec`, `unknown_session`,
                `session_expired`, `chunk_checksum_mismatch`,
                `chunk_seq_conflict`, `chunk_too_large`, `audio_too_short`,
                `audio_too_quiet`, `no_speech_detected`,
                `transcription_failed`, `internal_error`, and — added in 1.1 —
                `input_invalid`, `unsupported_input_type`, `session_conflict`,
                `prompt_invalid`, `unsupported_aspect_ratio`,
                `unsupported_quality`, `image_generation_failed`, `not_found`;
                and — added in 1.2 — `backend_not_ready`, and for the optional
                pairing extension `pairing_disabled`, `pairing_token_invalid`,
                `pairing_token_expired`, `pairing_token_consumed`,
                `pairing_token_revoked`, `pairing_url_mismatch`.
                The list is append-only; clients treat unknown codes by
                `retryable`.
            message:
              type: string
              description: Human-readable, safe to surface verbatim in the keyboard status row.
            retryable:
              type: boolean
              description: Whether retrying the same operation may succeed.
        request_id:
          type: string
          description: Server-generated correlation id, present on every response.

    Health:
      type: object
      required: [status, contract, time]
      properties:
        status:
          type: string
          enum: [ok, degraded, not_ready]
          description: |
            `ok` — conforming and serving.
            `degraded` — serving, but an upstream dependency is impaired; the
            client shows a warning state, not a failure.
            `not_ready` (1.2) — does not meet the contract, because dictation is
            mandatory and unavailable, or no API key is configured. The client
            shows a setup-incomplete state and points at `readiness.blockers`.
            A backend never reports `ok` while `readiness.ready` is false.
        service:
          type: string
          description: Implementation name, free-form.
        contract:
          type: string
          description: Contract identifier. Must be `caret/v1` for this document.
          const: caret/v1
        version:
          type: string
          description: Implementation version, free-form.
        time:
          type: string
          format: date-time
        auth:
          type: object
          description: Present when the server evaluates authorization on health probes.
          properties:
            presented:
              type: boolean
            valid:
              type: [boolean, "null"]
              description: "`null` when no key was presented."
        readiness:
          type: object
          description: |
            Added in 1.2. Whether this backend meets the contract, and what is
            missing if not. Absent on pre-1.2 backends; a client that does not
            find it falls back to `status`.
          required: [ready, blockers]
          properties:
            ready: { type: boolean }
            blockers:
              type: array
              description: Empty when `ready` is true.
              items:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    description: |
                      Stable, append-only. `no_stt_adapter` — dictation is
                      mandatory and no transcriber is configured.
                      `no_api_keys` — no key configured, so every authenticated
                      call fails closed.
                    examples: [no_stt_adapter, no_api_keys]
                  message:
                    type: string
                    description: Human-readable, safe to show during setup.
          example:
            ready: false
            blockers:
              - code: no_stt_adapter
                message: "dictation is mandatory and no STT adapter is configured"
        capabilities:
          type: object
          description: |
            Which contract surfaces this backend implements. `dictation` must be
            `true` on a conforming backend (see "Dictate is mandatory" above);
            `draft` and `imagine` are honestly `false` when nothing is
            configured to serve them.
          properties:
            draft: { type: boolean }
            dictation: { type: boolean }
            imagine:
              type: boolean
              description: Added in 1.1. Absent means false.
            input_modes:
              type: object
              description: |
                Added in 1.1. Which input types each surface accepts. A client
                that does not find a surface here assumes `["text"]` for
                `draft`/`imagine` and `["audio"]` for `dictation`.
              additionalProperties:
                type: array
                items:
                  type: string
                  enum: [text, audio]
              example:
                draft: [text, audio]
                imagine: [text, audio]
                dictation: [audio]
        request_id:
          type: string

    PairingMintRequest:
      type: object
      required: [server_url]
      properties:
        server_url:
          type: string
          format: uri
          description: |
            The base URL the device will use. The token is bound to it and can
            only be claimed against it. `https://` is required outside the
            operator's own network.
          examples: ["https://agent.example.com"]
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 900
          default: 300
          description: |
            Lifetime. Bounded deliberately — a pairing window longer than a few
            minutes is a standing invitation, not a setup step.

    PairingMintResponse:
      type: object
      required: [token_id, pairing_token, server_url, expires_at, single_use, request_id]
      properties:
        token_id:
          type: string
          description: Handle for listing and revoking. Not a credential.
          examples: [pt_1a2b3c4d]
        pairing_token:
          type: string
          description: |
            The secret, returned once and never recoverable — the server keeps
            only its digest. Treat as a credential in transit.
        server_url: { type: string, format: uri, description: Canonicalised. }
        payload:
          type: string
          description: |
            A transport-ready encoding of the token and URL, if the backend
            offers one. Never contains the API key.
        expires_at: { type: string, format: date-time }
        expires_in_seconds: { type: integer }
        single_use:
          type: boolean
          const: true
          description: Always true; claiming consumes the token.
        request_id: { type: string }

    PairingTokenSummary:
      type: object
      description: Listing metadata. Never carries the token or the API key.
      required: [token_id, server_url, state]
      properties:
        token_id: { type: string }
        server_url: { type: string, format: uri }
        state:
          type: string
          enum: [pending, claimed, expired, revoked]
        created_at: { type: integer, description: Unix seconds. }
        expires_at: { type: integer, description: Unix seconds. }

    PairingClaimRequest:
      type: object
      required: [pairing_token, server_url]
      properties:
        pairing_token: { type: string }
        server_url:
          type: string
          format: uri
          description: |
            The URL the client was given. Checked against the one the token was
            minted for, so a relayed code cannot redirect the key elsewhere.
        device_name:
          type: string
          maxLength: 120
          description: Optional label for the server's log.

    PairingClaimResponse:
      type: object
      required: [api_key, server_url, contract, request_id]
      properties:
        api_key:
          type: string
          description: The durable key. This response is the only place it appears.
        server_url: { type: string, format: uri }
        contract: { type: string, const: caret/v1 }
        service: { type: string }
        version: { type: string }
        capabilities:
          type: object
          description: |
            Same shape as `Health.capabilities`, so a client is configured and
            knows what the backend can do in one round trip.
        readiness:
          type: object
          description: Same shape as `Health.readiness`.
        token_id: { type: string }
        request_id: { type: string }

    PairingRevokeRequest:
      type: object
      description: Provide a `token_id`, or set `all` to true.
      properties:
        token_id: { type: string }
        all:
          type: boolean
          description: Revoke every pending token.

    TextInput:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: text }
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: What the user typed.

    AudioInput:
      type: object
      required: [type, session_id, client_chunk_count, client_total_duration_ms]
      description: |
        Names an audio session opened at `POST /v1/dictation/sessions` and
        uploaded chunk-by-chunk. The completeness fields are the same ones
        dictation finalize takes and are verified the same way.
      properties:
        type: { type: string, const: audio }
        session_id: { type: string }
        client_chunk_count:
          type: integer
          minimum: 1
          description: Total chunks the client uploaded (seq 0..count-1).
        client_total_duration_ms:
          type: integer
          minimum: 1
        polish:
          type: boolean
          default: true
          description: |
            Whether the backend may clean the transcript before using it.
            Same meaning as on dictation finalize.

    Input:
      description: The user's input. Exactly one of the two shapes.
      oneOf:
        - $ref: "#/components/schemas/TextInput"
        - $ref: "#/components/schemas/AudioInput"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextInput"
          audio: "#/components/schemas/AudioInput"

    AsyncInProgress:
      type: object
      required: [status, retry_after_seconds, request_id]
      description: |
        Returned with `202` by every asynchronous surface (spoken Ask, Imagine,
        dictation finalize). Poll by re-posting the identical request body.
      properties:
        status: { type: string, enum: [in_progress] }
        session_id:
          type: string
          description: Present when the work is driven by an audio session.
        started_at: { type: string, format: date-time }
        elapsed_seconds: { type: number }
        retry_after_seconds: { type: integer }
        request_id:
          type: string
          description: Stable across every 202 poll and the eventual terminal response.

    DraftRequest:
      type: object
      required: [client_request_id]
      description: |
        Provide exactly one of `input` (preferred) or `instruction` (the 1.0
        alias for a text input). Both, or neither, is `422 input_invalid`.
      properties:
        input:
          $ref: "#/components/schemas/Input"
        instruction:
          type: string
          minLength: 1
          maxLength: 4000
          deprecated: true
          description: |
            1.0 alias for a text input. Still supported.
        visible_text:
          type: string
          maxLength: 4000
          description: Optional near-cursor text from the host field (all the OS lets a keyboard see). Never the whole conversation.
        app_hint:
          type: string
          maxLength: 200
          description: Optional host-app hint (e.g. "WhatsApp"). Soft signal only.
        client_request_id:
          type: string
          maxLength: 128
          description: Client-generated UUID. Idempotency key — replays return the original result.

    DraftResponse:
      type: object
      required: [text, request_id]
      properties:
        text:
          type: [string, "null"]
          description: |
            The single insert-ready message. The client always previews before
            insertion. `null` only when `status` is `missing_chunks`.
        status:
          type: string
          enum: [complete, missing_chunks]
          default: complete
          description: Added in 1.1. Absent means `complete` (1.0 servers).
        input_type:
          type: string
          enum: [text, audio]
          description: Added in 1.1. Which input produced this draft.
        session_id:
          type: string
          description: Echoed for audio input.
        transcript:
          type: string
          description: |
            Added in 1.1. What the backend heard, for audio input — the text the
            draft was written from. Clients may show it under the preview.
        missing_chunks:
          type: array
          items: { type: integer }
          description: Sequence numbers still missing. Empty on success.
        duration_ms:
          type: integer
        request_id:
          type: string

    ImagineRequest:
      type: object
      required: [client_request_id]
      description: |
        Provide exactly one of `input` (preferred) or `prompt` (the 1.0 alias
        for a text input). Both, or neither, is `422 input_invalid`.
      properties:
        input:
          $ref: "#/components/schemas/Input"
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          deprecated: true
          description: |
            1.0 alias for a text input. Still supported.
        aspect_ratio:
          type: string
          maxLength: 32
          description: Backend-defined set; unsupported values are `422 unsupported_aspect_ratio`.
        quality:
          type: string
          maxLength: 16
          description: Backend-defined set; unsupported values are `422 unsupported_quality`.
        app_hint:
          type: string
          maxLength: 200
        client_request_id:
          type: string
          maxLength: 128
          description: |
            Client-generated UUID. Idempotency key and poll key — re-posting the
            identical body with the same id polls the same job; terminal results
            (success and failure) are cached against it.

    ImagineResponse:
      type: object
      required: [status, request_id]
      properties:
        status:
          type: string
          enum: [complete, missing_chunks]
        input_type:
          type: string
          enum: [text, audio]
        media:
          type: object
          description: The generated image. Present when `status` is `complete`.
          required: [kind, mime_type, byte_length, sha256]
          properties:
            kind: { type: string, enum: [image] }
            mime_type: { type: string }
            filename: { type: string }
            byte_length: { type: integer }
            sha256:
              type: string
              description: Lowercase hex SHA-256 of the decoded bytes; the client verifies it.
            inline_base64:
              type: string
              description: Base64 of the image bytes.
            data_url:
              type: string
              description: Optional convenience form of the same bytes.
        provider: { type: string }
        model: { type: string }
        aspect_ratio: { type: string }
        size: { type: string }
        quality: { type: string }
        session_id: { type: string }
        transcript:
          type: string
          description: What the backend heard, for a spoken prompt.
        missing_chunks:
          type: array
          items: { type: integer }
        request_id: { type: string }

    DictationSessionRequest:
      type: object
      required: [client_request_id, codec, sample_rate_hz, channels]
      properties:
        client_request_id:
          type: string
          maxLength: 128
          description: Idempotency key — replays return the same `session_id`.
        codec:
          type: string
          enum: [pcm16]
          description: v1 supports pcm16 (little-endian) only.
        sample_rate_hz:
          type: integer
          enum: [16000]
        channels:
          type: integer
          enum: [1]
        intent:
          type: string
          enum: [dictate, ask, imagine]
          default: dictate
          description: |
            Added in 1.1. Which surface the client expects to consume this
            session with. Advisory: the backend may use it to pre-warm or to
            reject early (`422 unsupported_input_type`) but must not require it,
            and the session may still be consumed by any single surface.
        app_hint:
          type: string
          maxLength: 200
        language_hint:
          type: string
          maxLength: 16
          description: Optional BCP-47 language tag; backends may ignore it.

    DictationSessionResponse:
      type: object
      required: [session_id, chunk_max_bytes, chunk_target_duration_ms, request_id]
      properties:
        session_id:
          type: string
        chunk_max_bytes:
          type: integer
          description: Hard per-chunk byte cap the server enforces (413 beyond it).
        chunk_target_duration_ms:
          type: integer
          description: Advisory chunk sizing (the client targets ~3000 ms but may deviate).
        expires_at:
          type: string
          format: date-time
          description: When the un-finalized session is discarded server-side.
        request_id:
          type: string

    ChunkResponse:
      type: object
      required: [session_id, seq, accepted, request_id]
      properties:
        session_id: { type: string }
        seq: { type: integer }
        accepted: { type: boolean }
        duplicate:
          type: boolean
          description: True when this exact chunk was already stored (idempotent replay).
        request_id: { type: string }

    FinalizeRequest:
      type: object
      required: [client_chunk_count, client_total_duration_ms]
      properties:
        client_chunk_count:
          type: integer
          minimum: 1
          description: Total chunks the client uploaded (seq 0..count-1). The server verifies completeness against this.
        client_total_duration_ms:
          type: integer
          minimum: 1
        polish:
          type: boolean
          default: true
          description: When true the backend may clean the raw transcript (punctuation, casing, filler removal). When false it returns raw STT output.

    FinalizeResponse:
      type: object
      required: [session_id, status, missing_chunks, request_id]
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [complete, missing_chunks]
        text:
          type: [string, "null"]
          description: The insert-ready transcript. `null` when `status` is `missing_chunks`.
        missing_chunks:
          type: array
          items: { type: integer }
          description: Sequence numbers the server never received. Client re-uploads these, then re-finalizes.
        duration_ms:
          type: integer
        request_id: { type: string }

    FinalizeInProgress:
      type: object
      required: [session_id, status, retry_after_seconds, request_id]
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [in_progress]
        started_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: number
        retry_after_seconds:
          type: integer
        request_id:
          type: string
          description: Stable across every 202 poll and the eventual terminal response.
